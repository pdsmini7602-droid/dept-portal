<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부서 포털 QR 코드</title>
<style>
  :root{--bg:#0b1220;--text:#dce5f2;--muted:#8fa0b8;--line:#22304a;--surface:#111b2e;--accent:#2bd1b5;--accent-ink:#04201c;--font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 20px;gap:20px;text-align:center}
  h1{margin:0;font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;color:#fff}
  h1 span{color:var(--accent)}
  .lead{margin:0;color:var(--muted);font-size:clamp(1rem,2vw,1.2rem)}
  .qr-card{background:#fff;border-radius:24px;padding:clamp(14px,3vmin,28px);box-shadow:0 18px 50px rgba(0,0,0,.45);width:min(88vw,70vh,640px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .qr-card svg{width:100%;height:100%;display:block}
  .qr-empty{color:#44506a;font-size:clamp(1rem,2.4vw,1.3rem);line-height:1.6;padding:24px}
  .url{margin:0;font-size:clamp(1.05rem,2.6vw,1.6rem);font-weight:700;color:var(--accent);word-break:break-all;min-height:1.6em}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
  .controls label{color:var(--muted);font-size:.95rem}
  .controls input{font-family:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);width:min(60vw,240px)}
  .controls input:focus{outline:2px solid var(--accent);outline-offset:2px}
  button{font-family:inherit;font-size:.95rem;font-weight:700;padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .msg{margin:0;color:#ff8a80;font-size:.9rem;min-height:1.3em}
  .note{margin:0;color:var(--muted);font-size:.85rem}
  @media print{
    body{background:#fff;color:#000}h1,.url{color:#000}.lead,.note{color:#333}.qr-card{box-shadow:none;border:1px solid #ccc}.controls,.msg,.note{display:none}
  }
  body.full .controls,body.full .note,body.full .msg{display:none}
</style>
</head>
<body>
  <h1>우리 부서 <span>포털</span></h1>
  <p class="lead">스마트폰 카메라로 QR 코드를 비추면 포털로 연결됩니다.</p>
  <div class="qr-card" id="qr" role="img" aria-label="포털 접속 QR 코드"></div>
  <p class="url" id="url"></p>
  <p class="msg" id="msg" role="alert"></p>
  <div class="controls">
    <label for="gid">GitHub 아이디</label>
    <input id="gid" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: my-id">
    <button type="button" id="full">전체 화면</button>
    <button type="button" id="print">인쇄</button>
  </div>
  <p class="note">주소 형식: https://아이디.github.io/dept-portal · 입력한 내용은 이 화면에서만 사용되며 저장하거나 외부로 보내지 않습니다.</p>

<script>
/* ===== 최소 QR 코드 생성기 (바이트 모드, 오류정정 M, 버전 1~5) ===== */
const QR = (function(){
  const EXP = new Array(512), LOG = new Array(256);
  (function(){ let x = 1; for (let i = 0; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i-255]; })();
  const mul = (a,b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  function rsGen(n){ let g = [1]; for (let i = 0; i < n; i++){ const ng = new Array(g.length + 1).fill(0); for (let j = 0; j < g.length; j++){ ng[j] ^= g[j]; ng[j+1] ^= mul(g[j], EXP[i]); } g = ng; } return g; }
  function rsEcc(data, n){ const g = rsGen(n), res = new Array(n).fill(0); for (const d of data){ const f = d ^ res.shift(); res.push(0); for (let i = 0; i < n; i++) res[i] ^= mul(g[i+1], f); } return res; }
  // [전체 코드워드, 블록당 오류정정 코드워드, 블록 수]
  const VER = {1:[26,10,1], 2:[44,16,1], 3:[70,26,1], 4:[100,18,2], 5:[134,24,2]};
  const ALIGN = {1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30]};
  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 0;
    for (let v = 1; v <= 5; v++){ const [tot, ecc, nb] = VER[v]; if (bytes.length <= tot - ecc*nb - 2) { ver = v; break; } }
    if (!ver) throw new Error("주소가 너무 깁니다.");
    const [tot, eccLen, nb] = VER[ver], dataLen = tot - eccLen*nb;
    let bits = []; const push = (val, n) => { for (let i = n-1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, 8); bytes.forEach(b => push(b, 8));
    for (let i = 0; i < 4 && bits.length < dataLen*8; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    const cw = []; for (let i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i+8).join(""), 2));
    for (let p = 0; cw.length < dataLen; p ^= 1) cw.push(p ? 0x11 : 0xec);
    const per = dataLen / nb, blocks = [], eccs = [];
    for (let b = 0; b < nb; b++){ const d = cw.slice(b*per, (b+1)*per); blocks.push(d); eccs.push(rsEcc(d, eccLen)); }
    const out = [];
    for (let i = 0; i < per; i++) blocks.forEach(b => out.push(b[i]));
    for (let i = 0; i < eccLen; i++) eccs.forEach(e => out.push(e[i]));
    const n = ver*4 + 17;
    const M = Array.from({length:n}, () => new Array(n).fill(0)), F = Array.from({length:n}, () => new Array(n).fill(false));
    const setF = (r,c,v) => { M[r][c] = v ? 1 : 0; F[r][c] = true; };
    function finder(r0,c0){ for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++){ const rr = r0+r, cc = c0+c; if (rr<0||cc<0||rr>=n||cc>=n) continue;
      const on = (r>=0&&r<=6&&(c===0||c===6)) || (c>=0&&c<=6&&(r===0||r===6)) || (r>=2&&r<=4&&c>=2&&c<=4); setF(rr,cc,on); } }
    finder(0,0); finder(0,n-7); finder(n-7,0);
    for (let i = 8; i < n-8; i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }
    const al = ALIGN[ver];
    for (const r of al) for (const c of al){ if (F[r][c]) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) setF(r+dr, c+dc, Math.max(Math.abs(dr),Math.abs(dc)) !== 1); }
    for (let i = 0; i < 9; i++){ if (!F[8][i]) setF(8,i,0); if (!F[i][8]) setF(i,8,0); }
    for (let i = 0; i < 8; i++){ if (!F[8][n-1-i]) setF(8,n-1-i,0); if (!F[n-1-i][8]) setF(n-1-i,8,0); }
    setF(n-8,8,1);
    // 데이터 배치
    const dbits = []; out.forEach(b => { for (let i = 7; i >= 0; i--) dbits.push((b>>i)&1); });
    let k = 0, up = true;
    for (let c = n-1; c > 0; c -= 2){ if (c === 6) c--;
      for (let i = 0; i < n; i++){ const r = up ? n-1-i : i;
        for (let d = 0; d < 2; d++){ const cc = c - d; if (F[r][cc]) continue; M[r][cc] = k < dbits.length ? dbits[k++] : 0; } }
      up = !up; }
    const masks = [(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];
    function fmt(mask){ let d = (0<<3) | mask, r = d; for (let i = 0; i < 10; i++) r = (r<<1) ^ ((r>>>9) ? 0x537 : 0); return ((d<<10) | (r & 0x3ff)) ^ 0x5412; }
    function build(mask){
      const B = M.map(row => row.slice());
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!F[r][c] && masks[mask](r,c)) B[r][c] ^= 1;
      const f = fmt(mask), bit = i => (f >> i) & 1;
      for (let i = 0; i <= 5; i++) B[i][8] = bit(i);
      B[7][8] = bit(6); B[8][8] = bit(7); B[8][7] = bit(8);
      for (let i = 9; i < 15; i++) B[8][14-i] = bit(i);
      for (let i = 0; i < 8; i++) B[8][n-1-i] = bit(i);
      for (let i = 8; i < 15; i++) B[n-15+i][8] = bit(i);
      B[n-8][8] = 1;
      return B;
    }
    function penalty(B){
      let p = 0;
      for (let pass = 0; pass < 2; pass++){
        for (let a = 0; a < n; a++){ let run = 1;
          for (let b = 1; b < n; b++){ const x = pass ? B[b][a] : B[a][b], y = pass ? B[b-1][a] : B[a][b-1];
            if (x === y) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      }
      for (let r = 0; r < n-1; r++) for (let c = 0; c < n-1; c++){ const v = B[r][c]; if (v === B[r][c+1] && v === B[r+1][c] && v === B[r+1][c+1]) p += 3; }
      const pat = [1,0,1,1,1,0,1,0,0,0,0], pat2 = pat.slice().reverse();
      for (let a = 0; a < n; a++) for (let b = 0; b <= n-11; b++){
        for (const q of [pat, pat2]){ let h = true, v = true; for (let i = 0; i < 11; i++){ if (B[a][b+i] !== q[i]) h = false; if (B[b+i][a] !== q[i]) v = false; } if (h) p += 40; if (v) p += 40; } }
      let dark = 0; B.forEach(row => row.forEach(v => dark += v));
      p += Math.floor(Math.abs(dark*20 - n*n*10) / (n*n)) * 10;
      return p;
    }
    let best = null, bp = Infinity;
    for (let m = 0; m < 8; m++){ const B = build(m), p = penalty(B); if (p < bp) { bp = p; best = B; } }
    return best;
  }
  function svg(text){
    const B = encode(text), n = B.length, q = 4, s = n + q*2;
    let d = ""; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (B[r][c]) d += `M${c+q},${r+q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {svg};
})();

/* ===== 화면 ===== */
const $ = id => document.getElementById(id);
const gid = $("gid"), qrEl = $("qr"), urlEl = $("url"), msgEl = $("msg");
const EMPTY = '<div class="qr-empty">GitHub 아이디를 입력하면<br>QR 코드가 만들어집니다.</div>';
function render(){
  const id = gid.value.trim().toLowerCase();
  msgEl.textContent = "";
  if (!id) { qrEl.innerHTML = EMPTY; urlEl.textContent = "https://아이디.github.io/dept-portal"; return; }
  if (!/^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$/.test(id)) {
    qrEl.innerHTML = EMPTY; urlEl.textContent = "";
    msgEl.textContent = "아이디는 영문·숫자·하이픈만 쓸 수 있고, 하이픈으로 시작하거나 끝날 수 없습니다.";
    return;
  }
  const url = "https://" + id + ".github.io/dept-portal";
  qrEl.innerHTML = QR.svg(url);
  qrEl.setAttribute("aria-label", "포털 접속 QR 코드: " + url);
  urlEl.textContent = url;
}
gid.addEventListener("input", render);
gid.value = "pdshp";   // 기본 아이디 (화면에서 바꿀 수 있습니다)
try { const q = new URLSearchParams(location.search).get("id"); if (q) gid.value = q; } catch (e) {}
render();
$("print").addEventListener("click", () => window.print());
$("full").addEventListener("click", () => {
  const on = document.body.classList.toggle("full");
  $("full").textContent = on ? "전체 화면" : "전체 화면";
  if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("full"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.body.classList.remove("full"); });
</script>
</body>
</html>
